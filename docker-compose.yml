version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queueguard
      POSTGRES_PASSWORD: queueguard
      POSTGRES_DB: queueguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  queue_service:
    build: ./queue_service
    ports:
      - "8001:8001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ADMIT_BATCH_SIZE: "5"
      ADMIT_INTERVAL_SECONDS: "5"
      TOKEN_TTL_SECONDS: "300"
    depends_on:
      redis:
        condition: service_healthy

  booking_service:
    build: ./booking_service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg2://queueguard:queueguard@postgres:5432/queueguard
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BOOKING_EVENTS_TOPIC: booking-events

      PAYMENT_FAILURE_RATE: "0.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification_service:
    build: ./notification_service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BOOKING_EVENTS_TOPIC: booking-events
      KAFKA_CONSUMER_GROUP: notification-service
      RECONNECT_DELAY_SECONDS: "5"
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    depends_on:
      - queue_service
      - booking_service

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:

