version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queueguard
      POSTGRES_PASSWORD: queueguard
      POSTGRES_DB: queueguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  queue_service:
    build: ./queue_service
    ports:
      - "8001:8001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ADMIT_BATCH_SIZE: "5"
      ADMIT_INTERVAL_SECONDS: "5"
      TOKEN_TTL_SECONDS: "300"
    depends_on:
      redis:
        condition: service_healthy

  booking_service:
    build: ./booking_service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg2://queueguard:queueguard@postgres:5432/queueguard
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_FAILURE_RATE: "0.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification_service:
    build: ./notification_service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
