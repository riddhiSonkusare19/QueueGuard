apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: queueguard
  labels:
    app: booking-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # zero downtime: never drop below desired replica count
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: __REGISTRY__/queueguard-booking-service:__TAG__
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: queueguard-config
          livenessProbe:
            httpGet: { path: /health/live, port: 8002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 8002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "150m", memory: "128Mi" }
            limits: { cpu: "400m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: queueguard
spec:
  selector:
    app: booking-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
