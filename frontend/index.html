<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QueueGuard — Get in line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #10121B;
    --ink-deep: #0A0B12;
    --surface: #191C29;
    --surface-line: #262B3D;
    --paper: #F4EEDD;
    --paper-dim: #C9C3B2;
    --accent: #E7A33E;
    --accent-deep: #C7862A;
    --success: #7FD8A6;
    --danger: #E2685A;
    --muted: #8A8FA6;
    --radius: 3px;
    --serif: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Archivo", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: var(--sans);
    background: var(--ink);
    background-image:
      radial-gradient(
        ellipse 900px 500px at 50% -10%,
        rgba(231,163,62,0.08),
        transparent 60%
      ),
      repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.012) 0px,
        rgba(255,255,255,0.012) 1px,
        transparent 1px,
        transparent 3px
      );
    color: var(--paper);
    min-height: 100vh;
    padding: env(safe-area-inset-top, 24px) 20px env(safe-area-inset-bottom, 24px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- top bar ---------- */

  .topbar {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 2px 0;
  }

  .wordmark {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
    color: var(--paper);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .wordmark .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }

  .wordmark .dot.live {
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(127,216,166,0.18);
  }

  .wordmark .dot.down {
    background: var(--danger);
    box-shadow: 0 0 0 3px rgba(226,104,90,0.18);
  }

  .gear-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 6px;
    border-radius: var(--radius);
    display: flex;
  }

  .gear-btn:hover {
    color: var(--paper);
  }

  .gear-btn svg {
    width: 18px;
    height: 18px;
  }

  /* ---------- settings drawer ---------- */

  .settings {
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.35s ease;
  }

  .settings.open {
    max-height: 320px;
  }

  .settings-inner {
    margin-top: 14px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: var(--radius);
  }

  .settings-inner label {
    display: block;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .settings-row {
    margin-bottom: 12px;
  }

  .settings-row:last-child {
    margin-bottom: 0;
  }

  .settings-inner input {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--surface-line);
    color: var(--paper);
    padding: 9px 10px;
    border-radius: var(--radius);
    font-family: var(--sans);
    font-size: 13.5px;
  }

  .settings-inner input:focus {
    border-color: var(--accent);
  }

  /* ---------- ticket ---------- */

  main {
    flex: 1;
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 420px;
    padding: 28px 0 40px;
  }

  .ticket-wrap {
    width: 100%;
    perspective: 1400px;
  }

  .ticket {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: var(--radius);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6);
    transform-style: preserve-3d;
    transition:
      transform 0.55s cubic-bezier(.5,0,.2,1),
      opacity 0.4s ease;
  }

  .ticket.flipping {
    transform: rotateX(8deg) scale(0.98);
    opacity: 0.4;
  }

  .stub-head {
    padding: 22px 26px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .stub-head .field {
    min-width: 0;
  }

  .stub-head .field-label {
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .stub-head .field-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--paper);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stub-head .field.right {
    text-align: right;
  }

  .tear {
    position: relative;
    height: 0;
    border-top: 2px dashed var(--surface-line);
    margin: 0 -1px;
  }

  .tear::before,
  .tear::after {
    content: "";
    position: absolute;
    top: -10px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--ink);
    background-image: inherit;
  }

  .tear::before {
    left: -11px;
  }

  .tear::after {
    right: -11px;
  }

  .stub-body {
    padding: 34px 26px 28px;
    text-align: center;
  }

  .status-label {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 14px;
    min-height: 16px;
  }

  .status-label.is-success {
    color: var(--success);
  }

  .status-label.is-danger {
    color: var(--danger);
  }

  .position-number {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 76px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }

  .position-caption {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 22px;
  }

  .pulse-track {
    position: relative;
    height: 2px;
    background: var(--surface-line);
    border-radius: 2px;
    margin-bottom: 26px;
    overflow: hidden;
  }

  .pulse-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.8s ease;
  }

  .pulse-dot {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 6px;
    height: 6px;
    margin-top: -3px;
    margin-left: -3px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(231,163,62,0.15);
    transition: left 0.8s ease;
  }

  @media (prefers-reduced-motion: no-preference) {
    .pulse-dot.active {
      animation: pulse-breathe 1.8s ease-in-out infinite;
    }
  }

  @keyframes pulse-breathe {
    0%, 100% {
      box-shadow: 0 0 0 4px rgba(231,163,62,0.15);
    }

    50% {
      box-shadow: 0 0 0 8px rgba(231,163,62,0.05);
    }
  }

  .ticket-copy {
    font-size: 13.5px;
    color: var(--paper-dim);
    line-height: 1.5;
    margin-bottom: 22px;
  }

  button.primary {
    width: 100%;
    background: var(--accent);
    color: var(--ink-deep);
    border: none;
    padding: 13px 20px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14.5px;
    border-radius: var(--radius);
    cursor: pointer;
    transition:
      background 0.15s ease,
      transform 0.1s ease;
  }

  button.primary:hover {
    background: var(--accent-deep);
  }

  button.primary:active {
    transform: scale(0.985);
  }

  button.primary:disabled {
    background: var(--surface-line);
    color: var(--muted);
    cursor: not-allowed;
  }

  button.ghost {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12.5px;
    cursor: pointer;
    margin-top: 14px;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--surface-line);
  }

  button.ghost:hover {
    color: var(--paper);
  }

  .id-line {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--paper-dim);
    background: var(--ink);
    border: 1px solid var(--surface-line);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 18px;
    word-break: break-all;
  }

  .expiry-track {
    height: 3px;
    background: var(--surface-line);
    border-radius: 2px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .expiry-fill {
    height: 100%;
    background: var(--success);
    width: 100%;
    transition:
      width 1s linear,
      background 0.4s ease;
  }

  .expiry-caption {
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* ---------- footer ---------- */

  footer {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2px;
    color: var(--muted);
    font-size: 11.5px;
  }

  .error-banner {
    max-width: 420px;
    width: 100%;
    background: rgba(226,104,90,0.12);
    border: 1px solid rgba(226,104,90,0.35);
    color: #F0B4AD;
    font-size: 12.5px;
    padding: 10px 14px;
    border-radius: var(--radius);
    margin-top: 14px;
    display: none;
    line-height: 1.5;
  }

  .error-banner.show {
    display: block;
  }

  @media (max-width: 460px) {
    .position-number {
      font-size: 62px;
    }

    .stub-body {
      padding: 28px 20px 24px;
    }

    .stub-head {
      padding: 18px 20px 16px;
    }
  }
</style>

<script>
(() => {

  const $ = (id) => document.getElementById(id);

  const els = {
    liveDot: $('liveDot'),
    gearBtn: $('gearBtn'),
    settingsDrawer: $('settingsDrawer'),

    inUserId: $('inUserId'),
    inEventId: $('inEventId'),
    inQueueUrl: $('inQueueUrl'),
    inBookingUrl: $('inBookingUrl'),

    headEvent: $('headEvent'),
    headUser: $('headUser'),

    ticket: $('ticket'),
    stubBody: $('stubBody'),

    errorBanner: $('errorBanner'),

    footLeft: $('footLeft'),
    footRight: $('footRight'),
  };


  const rand = () =>
    Math.random().toString(36).slice(2, 6);


  /*
   * IMPORTANT:
   * PostgreSQL events.id is UUID.
   *
   * Existing database event:
   * 11111111-1111-1111-1111-111111111111
   *
   * We keep this UUID internally for API requests,
   * while displaying "Concert 1" in the UI.
   */

  const DEFAULT_EVENT_ID =
    '11111111-1111-1111-1111-111111111111';

  const DEFAULT_EVENT_NAME =
    'Concert 1';


  /*
   * If an old browser session contains:
   *
   * qg_event = concert-1
   *
   * automatically replace it with the PostgreSQL UUID.
   */

  const storedEvent =
    localStorage.getItem('qg_event');

  if (
    storedEvent === 'concert-1' ||
    !storedEvent
  ) {
    localStorage.setItem(
      'qg_event',
      DEFAULT_EVENT_ID
    );
  }


  const defaults = {

    userId:
      localStorage.getItem('qg_user') ||
      `guest-${rand()}`,

    eventId:
      localStorage.getItem('qg_event') ||
      DEFAULT_EVENT_ID,

    queueUrl:
      localStorage.getItem('qg_queue_url') ||
      'http://localhost:8001',

    bookingUrl:
      localStorage.getItem('qg_booking_url') ||
      'http://localhost:8002',
  };


  els.inUserId.value =
    defaults.userId;

  els.inEventId.value =
    defaults.eventId;

  els.inQueueUrl.value =
    defaults.queueUrl;

  els.inBookingUrl.value =
    defaults.bookingUrl;


  els.headUser.textContent =
    defaults.userId;


  /*
   * Keep the UI friendly.
   * UUID is used internally, but the ticket shows Concert 1.
   */

  function updateEventDisplay(eventId) {

    if (eventId === DEFAULT_EVENT_ID) {
      els.headEvent.textContent =
        DEFAULT_EVENT_NAME;
    } else {
      els.headEvent.textContent =
        eventId;
    }
  }


  updateEventDisplay(defaults.eventId);


  function cfg() {

    return {

      userId:
        els.inUserId.value.trim() ||
        defaults.userId,

      eventId:
        els.inEventId.value.trim() ||
        defaults.eventId,

      queueUrl:
        els.inQueueUrl.value
          .trim()
          .replace(/\/$/, ''),

      bookingUrl:
        els.inBookingUrl.value
          .trim()
          .replace(/\/$/, ''),
    };
  }


  function persist() {

    const c = cfg();

    localStorage.setItem(
      'qg_user',
      c.userId
    );

    localStorage.setItem(
      'qg_event',
      c.eventId
    );

    localStorage.setItem(
      'qg_queue_url',
      c.queueUrl
    );

    localStorage.setItem(
      'qg_booking_url',
      c.bookingUrl
    );

    els.headUser.textContent =
      c.userId;

    updateEventDisplay(
      c.eventId
    );
  }


  [
    els.inUserId,
    els.inEventId,
    els.inQueueUrl,
    els.inBookingUrl
  ].forEach(input => {

    input.addEventListener(
      'change',
      persist
    );

  });


  els.gearBtn.addEventListener(
    'click',
    () => {

      const open =
        els.settingsDrawer
          .classList
          .toggle('open');

      els.gearBtn.setAttribute(
        'aria-expanded',
        open
      );
    }
  );


  function setLive(state) {

    els.liveDot.className =
      'dot' +
      (
        state === 'live'
          ? ' live'
          : state === 'down'
            ? ' down'
            : ''
      );
  }


  function showError(msg) {

    if (!msg) {

      els.errorBanner
        .classList
        .remove('show');

      return;
    }

    els.errorBanner.textContent =
      msg;

    els.errorBanner
      .classList
      .add('show');
  }


  async function api(url, opts) {

    try {

      const res =
        await fetch(url, opts);

      setLive('live');
      showError(null);

      return res;

    } catch (e) {

      setLive('down');

      showError(
        `Can't reach ${new URL(url).host} — ` +
        `is it running, and does it allow ` +
        `requests from this page (CORS)?`
      );

      throw e;
    }
  }


  // ---------------- state machine ----------------

  // phases:
  // idle
  // queued
  // admitted
  // confirmed
  // soldout
  // failed

  let phase = 'idle';

  let pollTimer = null;
  let expiryTimer = null;

  let admissionToken = null;
  let admittedAt = null;
  let currentBookingId = null;

  const TOKEN_TTL_SECONDS = 300;


  function render(state) {

    const c = cfg();

    const flip = () => {

      els.ticket
        .classList
        .add('flipping');

      setTimeout(
        () =>
          els.ticket
            .classList
            .remove('flipping'),
        260
      );
    };


    if (phase !== state.phase) {
      flip();
    }


    phase = state.phase;


    if (phase === 'idle') {

      els.stubBody.innerHTML = `
        <div class="status-label">
          not yet in line
        </div>

        <div class="ticket-copy">
          When the drop opens, join the line —
          you'll get a live position and be let
          through in the order you arrived.
        </div>

        <button
          class="primary"
          id="btnJoin"
        >
          Join the queue
        </button>
      `;

      $('btnJoin')
        .addEventListener(
          'click',
          joinQueue
        );

      els.footLeft.textContent =
        'not in line yet';

      els.footRight.textContent =
        '';
    }


    if (phase === 'queued') {

      els.stubBody.innerHTML = `
        <div class="status-label">
          in line
        </div>

        <div class="position-number">
          ${String(state.position).padStart(3, '0')}
        </div>

        <div class="position-caption">
          ${state.position - 1}
          ${
            state.position - 1 === 1
              ? 'guest'
              : 'guests'
          }
          ahead of you
        </div>

        <div class="pulse-track">
          <div
            class="pulse-fill"
            id="pulseFill"
          ></div>

          <div
            class="pulse-dot active"
            id="pulseDot"
          ></div>
        </div>

        <div class="ticket-copy">
          Keep this open — you'll move up
          automatically as the next batch
          is let through.
        </div>
      `;


      const pct =
        Math.max(
          4,
          Math.min(
            96,
            100 -
            Math.min(state.position, 40) *
            2.4
          )
        );


      requestAnimationFrame(() => {

        $('pulseFill').style.width =
          pct + '%';

        $('pulseDot').style.left =
          pct + '%';

      });


      els.footLeft.textContent =
        `position ${state.position}`;

      els.footRight.textContent =
        state.depth != null
          ? `${state.depth} in line`
          : '';
    }


    if (phase === 'admitted') {

      els.stubBody.innerHTML = `
        <div class="status-label is-success">
          you're up
        </div>

        <div
          class="ticket-copy"
          style="margin-bottom:16px;"
        >
          A slot is being held for you.
          Claim it before your admission expires.
        </div>

        <div class="expiry-track">
          <div
            class="expiry-fill"
            id="expiryFill"
          ></div>
        </div>

        <div
          class="expiry-caption"
          id="expiryCaption"
        >
          expires in 5:00
        </div>

        <button
          class="primary"
          id="btnClaim"
        >
          Claim your slot
        </button>
      `;


      $('btnClaim')
        .addEventListener(
          'click',
          claimSlot
        );


      startExpiryCountdown();


      els.footLeft.textContent =
        'admitted';

      els.footRight.textContent =
        '';
    }


    if (phase === 'confirmed') {

      els.stubBody.innerHTML = `
        <div class="status-label is-success">
          confirmed
        </div>

        <div
          class="ticket-copy"
          style="margin-bottom:14px;"
        >
          Your spot is secured.
          Keep the booking ID below
          for your records.
        </div>

        <div class="id-line">
          ${state.bookingId}
        </div>

        <button
          class="ghost"
          id="btnRelease"
        >
          Release this slot
        </button>
      `;


      $('btnRelease')
        .addEventListener(
          'click',
          releaseBooking
        );


      clearInterval(expiryTimer);


      els.footLeft.textContent =
        'booking confirmed';

      els.footRight.textContent =
        '';
    }


    if (phase === 'soldout') {

      els.stubBody.innerHTML = `
        <div class="status-label is-danger">
          sold out
        </div>

        <div class="ticket-copy">
          Every slot for this event has
          been claimed. Thanks for waiting
          with us.
        </div>

        <button
          class="ghost"
          id="btnReset"
        >
          Start over
        </button>
      `;


      $('btnReset')
        .addEventListener(
          'click',
          reset
        );


      els.footLeft.textContent =
        'sold out';

      els.footRight.textContent =
        '';
    }


    if (phase === 'failed') {

      els.stubBody.innerHTML = `
        <div class="status-label is-danger">
          that didn't go through
        </div>

        <div class="ticket-copy">
          ${
            state.message ||
            'Something interrupted your claim.'
          }
        </div>

        <button
          class="primary"
          id="btnRetry"
        >
          Try again
        </button>
      `;


      $('btnRetry')
        .addEventListener(
          'click',
          claimSlot
        );
    }
  }


  function startExpiryCountdown() {

    clearInterval(expiryTimer);

    admittedAt =
      admittedAt || Date.now();


    expiryTimer =
      setInterval(() => {

        const elapsed =
          (Date.now() - admittedAt) /
          1000;

        const remaining =
          Math.max(
            0,
            TOKEN_TTL_SECONDS -
            elapsed
          );

        const pct =
          Math.max(
            0,
            (remaining /
              TOKEN_TTL_SECONDS) *
              100
          );


        const fill =
          $('expiryFill');

        const cap =
          $('expiryCaption');


        if (!fill || !cap) {
          return;
        }


        fill.style.width =
          pct + '%';


        if (pct < 25) {
          fill.style.background =
            'var(--danger)';
        }


        const m =
          Math.floor(
            remaining / 60
          );

        const s =
          Math.floor(
            remaining % 60
          );


        cap.textContent =
          remaining > 0
            ? `expires in ${m}:${String(s).padStart(2, '0')}`
            : 'expired — rejoin the queue';


        if (remaining <= 0) {
          clearInterval(expiryTimer);
        }

      }, 1000);
  }


  async function joinQueue() {

    const c = cfg();

    persist();


    try {

      const res =
        await api(
          `${c.queueUrl}/queue/join`,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body: JSON.stringify({
              user_id: c.userId,

              /*
               * IMPORTANT:
               * This is now the PostgreSQL UUID.
               */
              event_id: c.eventId
            }),
          }
        );


      const data =
        await res.json();


      if (
        data.status ===
        'already_admitted'
      ) {

        admissionToken =
          data.admission_token;

        admittedAt =
          Date.now();

        render({
          phase: 'admitted'
        });

      } else {

        render({
          phase: 'queued',
          position:
            data.position || 1
        });

        startPolling();
      }

    } catch (_) {

      // Error banner already shown.

    }
  }


  function startPolling() {

    clearInterval(pollTimer);

    pollTimer =
      setInterval(
        pollStatus,
        2000
      );

    pollStatus();
  }


  async function pollStatus() {

    if (phase !== 'queued') {

      clearInterval(
        pollTimer
      );

      return;
    }


    const c = cfg();


    try {

      const [
        statusRes,
        depthRes
      ] = await Promise.all([

        api(
          `${c.queueUrl}/queue/status/` +
          `${encodeURIComponent(c.eventId)}/` +
          `${encodeURIComponent(c.userId)}`
        ),

        api(
          `${c.queueUrl}/queue/depth/` +
          `${encodeURIComponent(c.eventId)}`
        ).catch(() => null),

      ]);


      const data =
        await statusRes.json();


      let depth = null;


      if (depthRes) {

        try {

          depth =
            (await depthRes.json())
              .depth;

        } catch (_) {}

      }


      if (
        data.status ===
        'admitted'
      ) {

        clearInterval(
          pollTimer
        );

        admissionToken =
          data.admission_token;

        admittedAt =
          Date.now();

        render({
          phase: 'admitted'
        });

      } else if (
        data.status ===
        'queued'
      ) {

        render({
          phase: 'queued',
          position:
            data.position,
          depth
        });
      }

    } catch (_) {

      // Keep polling.
      // Error banner is already shown.

    }
  }


  async function claimSlot() {

    const c = cfg();


    const btn =
      $('btnClaim') ||
      $('btnRetry');


    if (btn) {

      btn.disabled = true;

      btn.textContent =
        'Claiming…';
    }


    try {

      const res =
        await api(
          `${c.bookingUrl}/bookings`,
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

              user_id:
                c.userId,

              /*
               * IMPORTANT:
               * Booking service receives
               * the PostgreSQL UUID.
               */
              event_id:
                c.eventId,

              admission_token:
                admissionToken
            }),
          }
        );


      if (res.status === 201) {

        const data =
          await res.json();

        currentBookingId =
          data.id;

        render({
          phase: 'confirmed',
          bookingId: data.id
        });

      } else if (
        res.status === 409
      ) {

        render({
          phase: 'soldout'
        });

      } else {

        const body =
          await res
            .json()
            .catch(
              () => ({})
            );


        render({
          phase: 'failed',

          message:
            body.detail ||
            `Request failed (${res.status}).`
        });
      }

    } catch (_) {

      // Error banner already shown.

    }
  }


  async function releaseBooking() {

    const c = cfg();

    const btn =
      $('btnRelease');


    if (!currentBookingId) {

      reset();

      return;
    }


    if (btn) {

      btn.disabled = true;

      btn.textContent =
        'Releasing…';
    }


    try {

      await api(
        `${c.bookingUrl}/bookings/` +
        `${encodeURIComponent(currentBookingId)}`,

        {
          method: 'DELETE'
        }
      );


      currentBookingId =
        null;

      reset();

    } catch (_) {

      if (btn) {

        btn.disabled = false;

        btn.textContent =
          'Release this slot';
      }
    }
  }


  function reset() {

    admissionToken =
      null;

    admittedAt =
      null;

    currentBookingId =
      null;


    clearInterval(
      pollTimer
    );

    clearInterval(
      expiryTimer
    );


    render({
      phase: 'idle'
    });
  }


  // ---------------- boot ----------------

  render({
    phase: 'idle'
  });

  setLive('idle');

})();
</script>

</body>
</html>
