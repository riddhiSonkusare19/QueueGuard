groups:
  - name: queueguard-alerts
    rules:

      # 1. Queue backlog is high
      - alert: QueueBacklogHigh
        expr: queueguard_queue_depth > 500
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Queue backlog is building up for {{ $labels.event_id }}"
          description: "Queue depth is {{ $value }}, above the 500 threshold for over a minute. This should trigger HPA to scale the Booking Service."

      # 2. Queue backlog is critically high
      - alert: QueueBacklogCritical
        expr: queueguard_queue_depth > 2000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Queue backlog is critically high for {{ $labels.event_id }}"
          description: "Queue depth is {{ $value }}. Users may be waiting significantly longer than expected."

      # 3. Booking failure rate is above 5%
      - alert: HighBookingFailureRate
        expr: >
          sum(rate(queueguard_bookings_failed_total[2m]))
          /
          clamp_min(
            sum(rate(queueguard_bookings_failed_total[2m]))
            + (sum(rate(queueguard_bookings_confirmed_total[2m])) or vector(0)),
            0.000001
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Booking failure rate above 5%"
          description: "The booking failure rate has exceeded 5% for more than 2 minutes."

      # 4. Queue Service is down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} for more than 1 minute."

      # 5. Pod CPU usage is high
      - alert: HighPodCPU
        expr: >
          sum by (pod) (
            rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m])
          ) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected on pod {{ $labels.pod }}"
          description: "Pod CPU usage has remained above 80% for more than 2 minutes."

      # 6. Pod is restarting frequently
      - alert: PodRestartingFrequently
        expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} is restarting frequently"
          description: "The pod has restarted more than 3 times within the last 10 minutes."