global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: "queue_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["queue_service:8001"]

  - job_name: "booking_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["booking_service:8002"]

